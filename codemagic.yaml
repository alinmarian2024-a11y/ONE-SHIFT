workflows:
  android-debug:
    name: ONE SHIFT - Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 17

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/daemon

    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        script: |
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
            --output /tmp/gradle-9.3.1-bin.zip
          unzip -q /tmp/gradle-9.3.1-bin.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle --version

      - name: Create debug keystore
        script: |
          keytool -genkeypair \
            -keystore "$CM_BUILD_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build debug APK
        script: |
          /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
