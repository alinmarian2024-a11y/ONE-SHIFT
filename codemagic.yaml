workflows:
  one-shift-debug:
    name: ONE SHIFT - Debug APK
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Find and build Android project
        script: |
          GRADLEW_PATH="$(find "$CM_BUILD_DIR" -type f -name gradlew -not -path "*/.git/*" -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No gradlew file exists anywhere in the repository."
            echo "Repository structure:"
            find "$CM_BUILD_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Android project found at: $PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug --stacktrace --no-daemon

    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
      - "**/build/reports/**"
