name: Build ONE SHIFT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          sdkmanager "platform-tools" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        run: |
          curl --fail --location --retry 3 \
            "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip" \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build APK
        run: /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error